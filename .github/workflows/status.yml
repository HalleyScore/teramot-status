name: Status page

# Probe every service in site/services.json and deploy site/
# plus the fresh data to GitHub Pages (status.teramot.com).
#
# Check history lives on the `status-data` branch, force-pushed as a single
# commit each run so it never grows.
#
# Requires Settings -> Pages -> Source = "GitHub Actions", custom domain
# status.teramot.com.

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # push status-data
  pages: write
  id-token: write

concurrency:
  group: status-page
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The SLA history lives only on status-data, and the save step below
      # force-pushes it. So "couldn't fetch" must fail the run, never fall
      # through to "start fresh" — that would overwrite the record.
      - name: Fetch previous history
        run: |
          mkdir -p site/data
          set +e
          git ls-remote --exit-code --heads origin status-data >/dev/null
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "No status-data branch yet; starting fresh history."
          elif [ "$rc" -ne 0 ]; then
            echo "::error::Could not reach origin to read status-data (exit $rc)"; exit 1
          else
            git fetch --depth=1 origin status-data
            git --work-tree=site/data checkout FETCH_HEAD -- .
            git reset -q
            test -s site/data/history.json || { echo "::error::status-data exists but has no history.json"; exit 1; }
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # GitHub fires this cron every 13-18 min in practice, not every 5, and a
      # check only covers the 15 min after it. So each run keeps checking once
      # a minute for ~10 min; the concurrency group queues the next run behind
      # this one, which makes coverage close to continuous. The page itself is
      # redeployed once per run.
      - name: Probe services (every minute for ~10 min)
        run: |
          end=$((SECONDS + 540))
          while :; do
            node scripts/check.mjs site/data
            [ "$SECONDS" -ge "$end" ] && break
            sleep 60
          done

      - name: Save history to status-data branch
        run: |
          cd site/data
          git init -q -b status-data
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Status check $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status-data
          rm -rf .git

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

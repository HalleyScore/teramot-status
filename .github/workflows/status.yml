name: Status page

# Every 5 minutes: probe every service in site/services.json and deploy site/
# plus the fresh data to GitHub Pages (status.teramot.com).
#
# Check history lives on the `status-data` branch, force-pushed as a single
# commit each run so it never grows.
#
# Requires Settings -> Pages -> Source = "GitHub Actions", custom domain
# status.teramot.com.

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # push status-data
  pages: write
  id-token: write

concurrency:
  group: status-page
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch previous history
        run: |
          mkdir -p site/data
          if git fetch --depth=1 origin status-data 2>/dev/null; then
            git --work-tree=site/data checkout FETCH_HEAD -- .
            git reset -q
          else
            echo "No status-data branch yet; starting fresh history."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe services
        run: node scripts/check.mjs site/data

      - name: Save history to status-data branch
        run: |
          cd site/data
          git init -q -b status-data
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add status.json history.json
          git commit -qm "Status check $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status-data
          rm -rf .git

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
